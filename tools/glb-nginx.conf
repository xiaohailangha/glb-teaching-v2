map $http_origin $glb_bad_origin { default 1; "" 0; "https://49.233.179.83" 0; }
map "$request_method:$http_sec_fetch_site" $glb_bad_site { default 0; "POST:cross-site" 1; "POST:same-site" 1; }
map $arg_previewPart $glb_part_uri {
  default /__invalid_model_part__;
  "" /assets/assets/avatar/models/storm-performance.glb;
  "~^[0-9]{1,3}$" /assets/assets/avatar/models/storm-parts/$arg_previewPart.bin;
}
server {
  listen 80 default_server;
  server_name 49.233.179.83;
  location ^~ /.well-known/acme-challenge/ { root /var/www/glb-acme; }
  location / { return 301 https://49.233.179.83$request_uri; }
}
server {
  listen 443 ssl http2 default_server;
  server_name 49.233.179.83;
  ssl_certificate /etc/letsencrypt/live/glb-teaching-ip/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/glb-teaching-ip/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  root /opt/glb-teaching/build/web;
  index index.html;
  server_tokens off;
  client_max_body_size 650k;
  if ($glb_bad_origin) { return 403; }
  if ($glb_bad_site) { return 403; }
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Cache-Control "private, no-cache" always;
  gzip_static on;
  gzip_vary on;
  location = /health { try_files /__not_a_file__ @glb_health; }
  location @glb_health { default_type application/json; return 200 '{"app":"glb-teaching","status":"ok"}'; }
  location ^~ /api/speech/ {
    proxy_pass http://127.0.0.1:5296;
    proxy_set_header Host 127.0.0.1:5296;
    proxy_set_header Origin http://127.0.0.1:5296;
    proxy_set_header Sec-Fetch-Site same-origin;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_read_timeout 100s;
    proxy_connect_timeout 5s;
    add_header Cache-Control "private, no-store" always;
  }
  location = /api/assets/model-manifest {
    proxy_pass http://127.0.0.1:5296;
    proxy_set_header Host 127.0.0.1:5296;
    proxy_set_header Origin http://127.0.0.1:5296;
    proxy_set_header Sec-Fetch-Site same-origin;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_read_timeout 25s;
    add_header Cache-Control "private, no-store" always;
  }
  location = /api/assets/scene-manifest {
    proxy_pass http://127.0.0.1:5296;
    proxy_set_header Host 127.0.0.1:5296;
    proxy_set_header Origin http://127.0.0.1:5296;
    proxy_set_header Sec-Fetch-Site same-origin;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_read_timeout 25s;
    add_header Cache-Control "private, no-store" always;
  }
  location = /assets/assets/avatar/models/storm-performance.glb {
    add_header X-Preview-Model-Bytes __MODEL_SIZE__;
    add_header X-Preview-Chunk-Size 1048576;
    add_header X-Preview-Model-ETag '"__MODEL_REVISION__"';
    add_header ETag '"__MODEL_REVISION__"';
    add_header Cache-Control "private, no-cache";
    etag off;
    try_files $glb_part_uri =404;
  }
  location ~ /\. { deny all; }
  location ~ ^/(api|avatar-dev|benchmark|performance-recording|services|tools|work|docs)(/|$) { return 404; }
  location / { try_files $uri $uri/ =404; }
}
