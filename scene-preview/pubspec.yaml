name: snow_speaks
description: Storm teaching renderer validation using Flutter GPU and flutter_scene.
publish_to: none
version: 0.2.0+5
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_scene:
    path: vendor/flutter_scene
  vector_math: ^2.2.0
  shared_preferences: ^2.5.5
  just_audio: 0.10.6
  record: 7.1.2
  http: 1.6.0
  flutter_svg: 2.3.2
  crypto: ^3.0.7
  hooks: ^2.0.2
  web: ^1.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - flutter_scene_generated/
    - assets/avatar/models/storm-rig.json
    - assets/avatar/models/storm-clothing-bindings.json
    - assets/avatar/models/storm-clothing-bindings.bin
    - assets/avatar/audio/
    - assets/avatar/courses/
    - assets/avatar/images/
    - assets/fonts/NotoSans-OFL.txt
    - path: flutter_scene_generated/metal_ios/
      platforms:
        - ios
    - path: flutter_scene_generated/metal_desktop/
      platforms:
        - macos
    - path: flutter_scene_generated/opengl_es_vulkan/
      platforms:
        - android
        - linux
        - windows
    - path: flutter_scene_generated/opengl_es/
      platforms:
        - web
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-ui.ttf

    - family: NotoSansIPA
      fonts:
        - asset: assets/fonts/NotoSans-IPA.ttf
