<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Snow Speaks · 把英语，说进生活。">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Snow Speaks">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Snow Speaks · 开口说英语</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preload" href="main.dart.js" as="script">
  <style>
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#f4f2eb; }
    #boot-world { position:fixed; inset:0; z-index:2147483646; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#252b27; background:#f4f2eb; font-family:system-ui,sans-serif; }
    #boot-world .mark { display:flex; align-items:center; gap:5px; height:72px; margin-bottom:24px; }
    #boot-world i { width:7px; height:26px; border-radius:8px; background:#252b27; animation:breathe 3.8s ease-in-out infinite; }
    #boot-world i:nth-child(2),#boot-world i:nth-child(4) { height:45px; animation-delay:-.4s; }
    #boot-world i:nth-child(3) { height:64px; animation-delay:-.8s; }
    #boot-world strong { font-size:23px; font-weight:600; letter-spacing:-1px; }
    #boot-world small { margin-top:0; color:#777c73; font-size:11px; letter-spacing:2px; }
    #boot-world { transition:opacity .38s ease; }
    #boot-world.is-ready { opacity:0; pointer-events:none; }
    #boot-line { position:absolute; bottom:0; left:0; right:0; height:2px; overflow:hidden; background:#e2e3dc; }
    #boot-line::after { content:""; position:absolute; inset:0; background:#252b27; transform:translateX(-100%); animation:loading-line 1.8s ease-in-out infinite; }
    #boot-world.is-ready #boot-line::after { animation:none; transform:translateX(0); }
    #boot-status { position:absolute; bottom:24px; left:24px; right:24px; font:11px system-ui,sans-serif; color:#777c73; letter-spacing:0; opacity:0; transition:opacity .3s; }
    #boot-status.visible { opacity:1; }
    #boot-status button { font:inherit; border:0; border-bottom:1px solid #777c73; padding:4px 0; margin-left:12px; background:none; color:#252b27; cursor:pointer; }
    @keyframes loading-line { 0% { transform:translateX(-100%); } 60%,100% { transform:translateX(100%); } }
    @keyframes breathe { 0%,100% { transform:scaleY(.86); } 25% { transform:scaleY(1); } 75% { transform:scaleY(.72); } }
    @media(prefers-reduced-motion:reduce) { #boot-world i { animation:none; } #boot-line::after { animation:none; transform:none; opacity:.3; } #boot-world { transition:none; } }

    #rotate-device { display: none; }
    @media (orientation: portrait) and (hover: none) and (pointer: coarse) {
      html[data-course="true"] #rotate-device {
        position: fixed; inset: 0; z-index: 2147483647;
        display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 16px; background: #5b5b5b;
        color: white; font: 18px system-ui, sans-serif; text-align: center;
      }
      #rotate-device small { color: #ddd; font-size: 13px; }
    }
  </style>
</head>
<body>
  <div id="boot-world" role="status"><div class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div><small>为每一次开口</small><div id="boot-status" aria-live="polite"></div><div id="boot-line" role="progressbar" aria-label="正在准备应用"></div></div>
  <script>
    (() => {
      const splash=document.getElementById('boot-world'),status=document.getElementById('boot-status');
      let finished=false;
      const slow=setTimeout(()=>{if(!finished){status.textContent='正在准备，首次进入会稍久一些';status.classList.add('visible');}},8000);
      window.sceneBootFailed=()=>{
        if(finished)return;
        clearTimeout(slow);status.replaceChildren(document.createTextNode('准备中断，请检查网络'));
        const retry=document.createElement('button');retry.textContent='重新打开';retry.onclick=()=>location.reload();status.append(retry);status.classList.add('visible');
        document.getElementById('boot-line').hidden=true;
      };
      const finish=()=>{if(finished)return;finished=true;clearTimeout(slow);splash.classList.add('is-ready');setTimeout(()=>splash.remove(),420);};
      window.addEventListener('flutter-first-frame',finish,{once:true});
      window.addEventListener('scene-ui-ready',finish,{once:true});
    })();
  </script>
  <div id="rotate-device" role="status">
    <span>请横过手机使用</span>
    <small>若画面未旋转，请关闭竖排方向锁定</small>
  </div>
  <script src="flutter_bootstrap.js" async onerror="window.sceneBootFailed()"></script>
</body>
</html>
