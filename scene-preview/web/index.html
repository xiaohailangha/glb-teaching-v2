<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Snow Speaks · 把英语，说进生活。">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Snow Speaks">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Snow Speaks · 开口说英语</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html,body { margin:0; background:#f4f2eb; }
    #boot-world { position:fixed; inset:0; z-index:2147483646; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#252b27; background:#f4f2eb; font-family:system-ui,sans-serif; }
    #boot-world .mark { display:flex; align-items:center; gap:5px; height:72px; margin-bottom:28px; }
    #boot-world i { width:7px; height:26px; border-radius:8px; background:#252b27; animation:breathe 1.4s ease-in-out infinite alternate; }
    #boot-world i:nth-child(2),#boot-world i:nth-child(4) { height:45px; animation-delay:.15s; }
    #boot-world i:nth-child(3) { height:64px; animation-delay:.3s; }
    #boot-world strong { font-size:23px; font-weight:600; letter-spacing:-1px; }
    #boot-world small { margin-top:18px; color:#777c73; font-size:11px; letter-spacing:2px; }
    @keyframes breathe { to { transform:scaleY(.65); opacity:.55; } }
    @media(prefers-reduced-motion:reduce) { #boot-world i { animation:none; } }

    #rotate-device { display: none; }
    @media (orientation: portrait) and (hover: none) and (pointer: coarse) {
      html[data-course="true"] #rotate-device {
        position: fixed; inset: 0; z-index: 2147483647;
        display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 16px; background: #5b5b5b;
        color: white; font: 18px system-ui, sans-serif; text-align: center;
      }
      #rotate-device small { color: #ddd; font-size: 13px; }
    }
  </style>
</head>
<body>
  <div id="boot-world" role="status"><div class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div><strong>snow speaks</strong><small>为每一次开口</small></div>
  <script>window.addEventListener('flutter-first-frame',()=>document.getElementById('boot-world')?.remove());</script>
  <div id="rotate-device" role="status">
    <span>请横过手机使用</span>
    <small>若画面未旋转，请关闭竖排方向锁定</small>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
