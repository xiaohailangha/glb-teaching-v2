<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="glb模型能力：Storm 人物动作、表情与发音演示。">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="glb模型能力">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>glb模型能力</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html,body { margin:0; background:#073645; }
    #boot-world { position:fixed; inset:0; z-index:2147483646; display:grid; place-content:center; text-align:center; color:#ffe4a0; background:radial-gradient(ellipse at 25% 70%,#267f82,transparent 65%),linear-gradient(#052c3b,#155a68); font-family:system-ui,sans-serif; }
    #boot-world strong { font-size:clamp(54px,10vw,96px); letter-spacing:-4px; text-shadow:0 6px #087176; }
    #boot-world span { margin-top:24px; color:#dcf1e8; font-size:18px; letter-spacing:4px; }
    #boot-world small { margin-top:56px; color:#a7cecd; font-size:13px; }

    #rotate-device { display: none; }
    @media (orientation: portrait) and (hover: none) and (pointer: coarse) {
      html[data-course="true"] #rotate-device {
        position: fixed; inset: 0; z-index: 2147483647;
        display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 16px; background: #5b5b5b;
        color: white; font: 18px system-ui, sans-serif; text-align: center;
      }
      #rotate-device small { color: #ddd; font-size: 13px; }
    }
  </style>
</head>
<body>
  <div id="boot-world" role="status"><strong>HELLO!</strong><span>世界，从这一声开始</span><small>正在打开学习世界</small></div>
  <script>window.addEventListener('flutter-first-frame',()=>document.getElementById('boot-world')?.remove());</script>
  <div id="rotate-device" role="status">
    <span>请横过手机使用</span>
    <small>若画面未旋转，请关闭竖排方向锁定</small>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
