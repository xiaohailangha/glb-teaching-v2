<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Snow Speaks · 把英语，说进生活">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Snow Speaks">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Snow Speaks · 开口说英语</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preload" href="main.dart.js" as="script">
  <link rel="preload" href="assets/assets/fonts/NotoSansSC-ui.ttf" as="font" type="font/ttf" crossorigin>
  <style>
    @font-face { font-family:EntrySC; src:url("assets/assets/fonts/NotoSansSC-ui.ttf") format("truetype"); font-display:block; }
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#f4f2eb; }
    #boot-world { box-sizing:border-box; padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); position:fixed; inset:0; z-index:2147483646; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#252b27; background:#f4f2eb; font-family:EntrySC,sans-serif; }
    #boot-world .mark { display:flex; align-items:center; gap:5px; height:72px; margin-bottom:24px; }
    #boot-world i { width:7px; height:26px; border-radius:8px; background:#252b27; animation:breathe 3.8s linear infinite; animation-delay:-3.014s; }
    #boot-world i:nth-child(2),#boot-world i:nth-child(4) { height:45px; animation-delay:-3.407s; }
    #boot-world i:nth-child(3) { height:64px; animation-delay:0s; }
    #boot-world small { margin-top:0; color:#777c73; font-size:12px; line-height:14.4px; letter-spacing:2px; }
    #boot-world { transition:opacity .38s ease; }
    #boot-world.is-ready { opacity:0; pointer-events:none; }
    #boot-line { position:absolute; bottom:0; left:0; right:0; height:2px; overflow:hidden; background:#e2e3dc; }
    #boot-line::after { content:""; position:absolute; inset:0; background:#252b27; transform:translateX(-100%); animation:loading-line 1.8s ease-in-out infinite; }
    #boot-world.is-ready #boot-line::after { animation:none; transform:translateX(0); }
    #boot-line.failed { height:3px; background:#ad4f38; cursor:pointer; }
    #boot-line.failed::after { animation:none; opacity:0; }
    @keyframes loading-line { 0% { transform:translateX(-100%); } 60%,100% { transform:translateX(100%); } }
    @keyframes breathe { 0%,100% { transform:scaleY(.86); } 25% { transform:scaleY(1); } 75% { transform:scaleY(.72); } }
    @media(prefers-reduced-motion:reduce) { #boot-world i { animation:none; } #boot-line::after { animation:none; transform:none; opacity:.3; } #boot-world { transition:none; } }

    #rotate-device { display: none; }
    @media (orientation: portrait) and (hover: none) and (pointer: coarse) {
      html[data-course="true"] #rotate-device {
        position: fixed; inset: 0; z-index: 2147483647;
        display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 16px; background: #5b5b5b;
        color: white; font: 18px system-ui, sans-serif; text-align: center;
      }
      #rotate-device small { color: #ddd; font-size: 13px; }
    }
  </style>
</head>
<body>
  <div id="boot-world" role="status"><div class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div><small>为每一次开口</small><div id="boot-line" role="progressbar" aria-label="正在准备应用"></div></div>
  <script>
    (() => {
      const splash=document.getElementById('boot-world'),line=document.getElementById('boot-line');
      let finished=false,frame;
      const bars=[...splash.querySelectorAll('i')];
      const reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;
      bars.forEach(bar=>bar.style.animation='none');
      function animateMark(){
        const phase=(Date.now()%3800)/3800*Math.PI*2;
        bars.forEach((bar,i)=>bar.style.transform=`scaleY(${reduced ? .9 : .86+.14*Math.sin(phase-Math.abs(i-2)*.65)})`);
        if(!finished)frame=requestAnimationFrame(animateMark);
      }
      animateMark();
      window.sceneBootFailed=()=>{
        if(finished)return;
        line.classList.add('failed');line.setAttribute('role','button');
        line.setAttribute('aria-label','加载中断，点击重试');line.tabIndex=0;
        line.onclick=()=>location.reload();line.onkeydown=e=>{if(e.key==='Enter'||e.key===' ')location.reload();};
      };
      const finish=()=>{if(finished)return;finished=true;cancelAnimationFrame(frame);splash.remove();};
      window.addEventListener('scene-ui-ready',finish,{once:true});
    })();
  </script>
  <div id="rotate-device" role="status">
    <span>请横过手机使用</span>
    <small>若画面未旋转，请关闭竖排方向锁定</small>
  </div>
  <script src="flutter_bootstrap.js" async onerror="window.sceneBootFailed()"></script>
</body>
</html>
